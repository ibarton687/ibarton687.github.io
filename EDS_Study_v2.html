<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS4 Study App</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="window._katexAutoRenderReady=true"></script>
<style>
:root{--bg:#0d0f1a;--bg2:#141728;--bg3:#1c2038;--bg4:#242848;--accent:#7c6fff;--cyan:#00d4ff;--green:#00e676;--yellow:#ffd740;--red:#ff5252;--pink:#ff6584;--text:#e8eaf6;--text2:#9fa8da;--border:#2a2f52;--card:#181b2e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#app{display:flex;height:100vh}
/* SIDEBAR */
#sb{width:250px;min-width:250px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
#sb-head{padding:16px;border-bottom:1px solid var(--border)}
#sb-head h1{font-size:1rem;color:var(--accent);font-weight:800;display:flex;align-items:center;gap:6px}
#sb-head p{font-size:.7rem;color:var(--text2);margin-top:2px}
.pb{height:5px;background:var(--bg3);border-radius:3px;margin-top:8px}
.pbf{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:3px;transition:width .5s}
.pl{font-size:.68rem;color:var(--text2);margin-top:3px}
nav{flex:1;padding:6px 0}
.ns{padding:8px 14px 3px;font-size:.65rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2)}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:.83rem;border-left:3px solid transparent;transition:all .15s;position:relative}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{border-left-color:var(--accent);background:var(--bg3);color:var(--accent)}
.ni .nn{width:20px;height:20px;border-radius:50%;background:var(--bg4);font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.ni.active .nn{background:var(--accent);color:#fff}
.ni .nct{margin-left:auto;font-size:.68rem;color:var(--text2)}
.ni.active .nct{color:var(--accent)}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#topbar h2{font-size:1rem;font-weight:700;flex-shrink:0}
.tabs{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.tb{padding:5px 12px;border-radius:6px;font-size:.75rem;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .15s;font-weight:600}
.tb:hover,.tb.active{background:var(--accent);border-color:var(--accent);color:#fff}
#content{flex:1;overflow-y:auto;padding:20px}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:14px;color:var(--cyan);display:flex;align-items:center;gap:8px}
/* THEORY */
.th h4{font-size:.85rem;font-weight:700;color:var(--yellow);margin:14px 0 7px;border-left:3px solid var(--yellow);padding-left:8px}
.th p,.th li{font-size:.84rem;line-height:1.7;color:var(--text2)}
.th ul,.th ol{padding-left:16px;margin-bottom:8px}
.th li{margin-bottom:3px}
.th strong{color:var(--text)}
.hl{background:var(--bg3);border-left:3px solid var(--accent);padding:9px 13px;border-radius:0 8px 8px 0;margin:8px 0;font-size:.83rem;line-height:1.6}
/* YouTube thumbnail link */
.yt-thumb{display:block;position:relative;border-radius:10px;overflow:hidden;margin:14px 0;cursor:pointer;text-decoration:none;background:#111;border:1px solid var(--border)}
.yt-thumb img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;transition:opacity .2s}
.yt-thumb:hover img{opacity:.8}
.yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:46px;background:rgba(220,0,0,.92);border-radius:12px;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.yt-play::after{content:'';border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:5px}
.yt-label{font-size:.72rem;color:var(--text2);margin:-8px 0 14px;text-align:center}
/* Theory worked examples */
.th .ex{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:.82rem}
.th .ex-title{font-weight:700;color:var(--cyan);margin-bottom:7px;font-size:.8rem}
.th .ex code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:.8rem;color:var(--green)}
.th .def{display:flex;gap:6px;align-items:baseline;margin-bottom:4px;font-size:.83rem}
.th .def .sym{min-width:80px;font-weight:700;color:var(--cyan);font-size:.8rem}
.th .def .desc{color:var(--text2);line-height:1.5}
.warn{border-left-color:var(--red)!important}
.tip{border-left-color:var(--green)!important}
/* QUIZ */
.qbox{margin-bottom:22px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.qhead{padding:12px 14px;background:var(--bg3);display:flex;align-items:flex-start;gap:10px}
.qnum{background:var(--accent);color:#fff;border-radius:5px;padding:2px 8px;font-size:.72rem;font-weight:800;flex-shrink:0;margin-top:1px}
.qsrc{background:var(--bg4);border:1px solid var(--border);color:var(--text2);border-radius:4px;padding:1px 7px;font-size:.68rem;margin-left:4px}
.qtype{font-size:.68rem;border-radius:4px;padding:1px 7px;margin-left:4px}
.qtype.calc{background:rgba(255,215,64,.15);color:var(--yellow);border:1px solid rgba(255,215,64,.3)}
.qtype.ds{background:rgba(255,101,132,.15);color:var(--pink);border:1px solid rgba(255,101,132,.3)}
.qtype.diag{background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.qtxt{font-size:.87rem;font-weight:500;line-height:1.6;flex:1}
.qbody{padding:0 14px 14px}
.qdiag{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0;overflow-x:auto;text-align:center}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-size:.83rem;transition:all .15s;background:var(--bg3)}
.opt:hover:not(.dis){border-color:var(--accent);background:var(--bg4)}
.opt .ol{font-weight:800;color:var(--accent);min-width:14px;flex-shrink:0}
.opt.ok{border-color:var(--green)!important;background:rgba(0,230,118,.08)!important}
.opt.ok .ol{color:var(--green)}
.opt.bad{border-color:var(--red)!important;background:rgba(255,82,82,.08)!important}
.opt.bad .ol{color:var(--red)}
.opt.dis{cursor:default}
.exp{background:var(--bg3);border-left:3px solid var(--green);padding:10px 13px;border-radius:0 8px 8px 0;margin-top:8px;font-size:.82rem;color:var(--text2);display:none;line-height:1.6}
.exp.show{display:block}
.exp strong{color:var(--green)}
/* CALC STEPS */
.steps{margin-top:10px}
.step{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:10px 13px;margin-bottom:6px;font-size:.82rem}
.step .sn{color:var(--cyan);font-weight:700;margin-bottom:4px}
.step .sf{font-family:'Courier New',monospace;background:var(--bg4);padding:4px 8px;border-radius:4px;margin:4px 0;display:inline-block;color:var(--yellow)}
/* FLASHCARDS */
.fc-wrap{perspective:1000px;cursor:pointer;margin-bottom:14px}
.fc{width:100%;height:180px;position:relative;transform-style:preserve-3d;transition:transform .5s;border-radius:12px}
.fc.flip{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:18px 20px;text-align:center;overflow-y:auto}
.fc-f{background:linear-gradient(135deg,var(--bg3),var(--bg4));border:1px solid var(--border)}
.fc-b{background:linear-gradient(135deg,rgba(124,111,255,.15),rgba(0,212,255,.1));border:1px solid var(--accent);transform:rotateY(180deg)}
.fc-f .ft{font-size:.9rem;font-weight:600}
.fc-b .bt{font-size:.85rem;color:var(--text2);line-height:1.6}
.fc-hint{font-size:.68rem;color:var(--text2);text-align:center;margin-bottom:10px}
/* FORMULAS */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fb{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 14px;text-align:center;transition:border-color .2s;overflow:hidden}
.fb:hover{border-color:var(--accent)}
.fb .ff{color:var(--cyan);margin-bottom:8px;min-height:40px;display:flex;align-items:center;justify-content:center;overflow-x:auto;max-width:100%}
.fb .fd{font-size:.75rem;color:var(--text2);line-height:1.4}
.katex{color:var(--cyan)!important}
.katex .mord,.katex .mbin,.katex .mrel,.katex .mpunct{color:var(--text)!important}
.katex .mfrac .frac-line{border-color:var(--cyan)!important}
.hl .katex,.tip .katex,.warn .katex{color:var(--text)!important}
.hl .katex .mord{color:var(--text)!important}
/* Flashcard back: softer colours */
.fc-b .katex{color:var(--text)!important;font-size:1.1rem}
.fc-b .katex-display{margin:.4em 0}
.fc-b .katex .mord,.fc-b .katex .mbin,.fc-b .katex .mrel{color:var(--text)!important}
.fc-b .katex .mfrac .frac-line{border-color:var(--cyan)!important}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--bg3);color:var(--cyan);padding:8px 11px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:7px 11px;border-bottom:1px solid var(--border);color:var(--text2)}
tr:hover td{background:rgba(124,111,255,.04)}
/* BUTTONS */
.btn{padding:7px 16px;border-radius:7px;border:none;cursor:pointer;font-size:.8rem;font-weight:700;transition:all .15s}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#8f84ff}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-o:hover{border-color:var(--accent);color:var(--accent)}
.btn-g{background:var(--green);color:#000}
/* SCORE BAR */
.scorebar{display:flex;gap:16px;align-items:center;background:var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.sc{text-align:center}
.sc .sv{font-size:1.3rem;font-weight:800;color:var(--cyan)}
.sc .sl{font-size:.68rem;color:var(--text2)}
/* HERO */
.hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(124,111,255,.12) 0%,transparent 70%);border-radius:50%}
.hero h2{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.hero p{color:var(--text2);font-size:.85rem;line-height:1.6;max-width:580px}
.badges{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.b1{background:rgba(124,111,255,.2);color:var(--accent);border:1px solid rgba(124,111,255,.3)}
.b2{background:rgba(255,101,132,.2);color:var(--pink);border:1px solid rgba(255,101,132,.3)}
.b3{background:rgba(255,215,64,.2);color:var(--yellow);border:1px solid rgba(255,215,64,.3)}
.b4{background:rgba(0,230,118,.2);color:var(--green);border:1px solid rgba(0,230,118,.3)}
/* TOPIC GRID */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.tc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px;cursor:pointer;transition:all .2s}
.tc:hover{border-color:var(--accent);transform:translateY(-2px)}
.tc .tn{font-size:.68rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.tc .tt{font-size:.88rem;font-weight:700;margin-bottom:5px}
.tc .td{font-size:.75rem;color:var(--text2)}
.tc .tq{font-size:.7rem;color:var(--text2);margin-top:6px}
/* DIVIDER */
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.divider span{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* SVG diagrams */
.svgwrap{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0;text-align:center;overflow-x:auto}
.svgwrap svg{display:inline-block}
/* EXAM TIMER */
.etimer{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);border-radius:8px;padding:8px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.etimer .et{font-size:1.4rem;font-weight:800;font-family:monospace;color:var(--red)}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
/* PROGRESS RING */
.pring{display:inline-flex;align-items:center;justify-content:center;position:relative}
/* FORMULA PANEL */
#fml-panel{position:fixed;top:0;right:-430px;width:410px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;transition:right .3s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 30px rgba(0,0,0,.5)}
#fml-panel.open{right:0}
#fml-panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg3)}
#fml-panel-body{flex:1;overflow-y:auto;padding:14px}
.fml-sec{margin-bottom:18px}
.fml-sec-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:8px}
.fml-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid transparent;margin-bottom:3px;transition:all .25s;cursor:default}
.fml-row:hover{background:var(--bg3);border-color:var(--border)}
.fml-row.hl{border-color:var(--yellow)!important;background:rgba(255,215,64,.1)!important;box-shadow:0 0 10px rgba(255,215,64,.25)}
.fml-row .fml-katex{flex:1;min-width:0;overflow-x:auto}
.fml-row .fml-lbl{font-size:.68rem;color:var(--text2);white-space:nowrap;padding-left:8px;border-left:1px solid var(--border);min-width:90px;text-align:right}
.fml-row.hl .fml-lbl{color:var(--yellow)}
/* KaTeX size override for panel */
#fml-panel-body .katex{font-size:1rem!important;color:var(--cyan)!important}
#fml-panel-body .katex .mord{color:var(--text)!important}
#fml-panel-body .katex .mfrac .frac-line{border-color:var(--cyan)!important}
/* Floating action button */
#fab-fml{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-size:1.4rem;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(124,111,255,.5);z-index:999;transition:all .2s;display:flex;align-items:center;justify-content:center}
#fab-fml:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(124,111,255,.7)}
#fab-fml.active{background:linear-gradient(135deg,var(--yellow),#ff9800)}
/* HINT */
.hint-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:6px;border:1px solid rgba(255,215,64,.4);background:rgba(255,215,64,.07);color:var(--yellow);font-size:.74rem;cursor:pointer;font-weight:700;transition:all .15s;margin-top:10px}
.hint-btn:hover{background:rgba(255,215,64,.18);border-color:var(--yellow)}
.hint-box{background:rgba(255,215,64,.06);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;padding:9px 13px;margin-top:6px;font-size:.82rem;color:var(--yellow);display:none;line-height:1.6;animation:fadein .2s}
.hint-box.show{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* OPEN ANSWER QUESTIONS */
.qtype.open{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.open-area{margin-top:10px}
.open-input{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.84rem;padding:10px 12px;font-family:'Segoe UI',system-ui,sans-serif;resize:vertical;min-height:90px;transition:border-color .2s;line-height:1.6}
.open-input:focus{outline:none;border-color:var(--accent)}
.open-num-wrap{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.open-num{width:160px;background:var(--bg4);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.1rem;padding:9px 13px;font-family:'Courier New',monospace;transition:border-color .2s;text-align:center}
.open-num:focus{outline:none;border-color:var(--accent)}
.open-unit{color:var(--text2);font-size:.9rem;font-style:italic}
.open-result{padding:12px 14px;border-radius:8px;margin-top:10px;font-size:.83rem;line-height:1.6;display:none}
.open-result.ok{background:rgba(0,230,118,.07);border:1px solid var(--green);color:var(--text);display:block}
.open-result.bad{background:rgba(255,82,82,.07);border:1px solid var(--red);color:var(--text);display:block}
.open-result .or-header{font-weight:800;font-size:.88rem;margin-bottom:6px}
.ok .or-header{color:var(--green)}
.bad .or-header{color:var(--red)}
.kw-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:700;margin:2px}
.kw-hit{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.kw-miss{background:rgba(255,82,82,.1);color:var(--red);border:1px solid rgba(255,82,82,.3);text-decoration:line-through}
.open-model{margin-top:10px;padding:10px 12px;background:var(--bg3);border-radius:7px;border-left:3px solid var(--cyan)}
.open-model strong{color:var(--cyan);display:block;margin-bottom:4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
.open-model p{color:var(--text2);font-size:.82rem;line-height:1.6}
.open-yours{margin-top:6px;padding:8px 11px;background:var(--bg3);border-radius:6px;font-size:.78rem;color:var(--text2)}
.open-yours em{color:var(--text)}
</style>
</head>
<body>
<button id="fab-fml" onclick="toggleFormulaPanel()" title="Formula Sheet">📐</button>
<div id="fml-panel">
  <div id="fml-panel-head">
    <span style="font-weight:800;color:var(--cyan);font-size:.95rem">📐 Formula Sheet</span>
    <button onclick="closeFormulaPanel()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px">✕</button>
  </div>
  <div id="fml-panel-body"><p style="color:var(--text2);font-size:.82rem;padding:10px">Loading...</p></div>
</div>
<div id="app">
<div id="sb">
  <div id="sb-head">
    <h1>⚡ EDS4 Study</h1>
    <p>Electrical Drive Systems 4 — Fontys</p>
    <div class="pb"><div class="pbf" id="pbf" style="width:0%"></div></div>
    <div class="pl" id="pbl">0 / 0 questions mastered</div>
  </div>
  <nav id="nav"></nav>
</div>
<div id="main">
  <div id="topbar">
    <h2 id="tbtitle">⚡ Overview</h2>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="content"></div>
</div>
</div>
<script>
// ─────────────────────────────────────────────
// SVG DIAGRAMS
// ─────────────────────────────────────────────
const SVG = {
hbridge:`<svg width="400" height="260" viewBox="0 0 400 260">
  <text x="200" y="14" fill="#9fa8da" text-anchor="middle" font-size="11" font-family="monospace">H-Bridge Circuit</text>
  <line x1="40" y1="30" x2="360" y2="30" stroke="#00d4ff" stroke-width="2"/>

t4:[
  {id:'t4q1',src:'2024',n:6,type:'diag',svg:'hbridge',
   text:'The circuit shows a DC motor in an H-bridge. What is the purpose of inductor L1 in series with the motor?',
   opts:[

   exp:'<strong>Answer: (c)</strong> — The inductor is a low-pass filter for CURRENT. PWM creates a pulsating voltage, but L opposes rapid current changes: ΔI = V×Δt/L. Higher L → smoother current → smoother torque. It does not "limit" current magnitude.'},

   text:'An H-bridge is powered by 24V DC. The PWM duty cycle is 75%. What is the average voltage across the motor?',

   text:'In an H-bridge, Q1 (top-left) and Q3 (bottom-left) are both ON at the same time. What mode is this?',

   ans:2,

  {id:'t4q4',src:'2024',n:14,type:'diag',svg:'mosfet_graph',
   text:'From the VGS–IDS graph shown, a MOSFET is being characterised. The current starts rising at approximately VGS = 1.2V. What does this value represent?',
   opts:['The saturation voltage V_sat','The threshold voltage V_th','The breakdown voltage','The pinch-off voltage'],
   ans:1,
   exp:'<strong>Answer: (b) Threshold voltage V_th ≈ 1.2V</strong> — V_th is the gate-source voltage at which the channel begins to form and drain current starts flowing. It is read from the VGS-IDS graph as the x-intercept of the rising curve.'},
  {id:'t4q5',src:'2024',n:14,type:'mc',
   text:'In the MOSFET characterisation circuit, a PWM signal drives the MOSFET gate through an RC low-pass filter. What happens if the RC filter is LEFT OUT?',
   opts:[
     'The MOSFET gate receives the DC average of the PWM → same result, RC is unnecessary.',
     'The MOSFET rapidly switches ON and OFF with the PWM frequency instead of operating in the linear region → the IDS measurement shows only two states (0 or I_sat), not the smooth VGS-IDS curve.',
     'The measurement is more accurate without the RC filter.',
     'The MOSFET is destroyed immediately.',
   ],
   ans:1,
   exp:'<strong>Answer: (b)</strong> — Without RC, the gate sees a square wave. The MOSFET switches between fully-OFF and fully-ON, giving no useful VGS-IDS characteristic. The RC filter converts PWM duty cycle D into an analog DC voltage D×V_dc, allowing the MOSFET to operate in its linear region.'},
  {id:'t4q6',src:'Practice',n:'P3',type:'mc',
   text:'Why does I_DS flatten/saturate at high VGS in the MOSFET characteristic curve?',
   opts:[
     'The MOSFET is damaged by high gate voltage.',
     'The MOSFET enters the ohmic region where current is limited by VDS.',
     'The MOSFET enters saturation — IDS is controlled by VGS, not VDS. Current is limited by the external circuit (supply voltage / series resistance).',
     'The threshold voltage increases at high VGS.',
   ],
   ans:2,
   exp:'<strong>Answer: (c)</strong> — Once VGS is high enough, the MOSFET is in the saturation region. IDS is determined by the external circuit (V_supply/R_sense). Further increase of VGS has little effect on IDS in this region.'},
  {id:'t4open1',src:'2024',n:'14a',type:'open',subtype:'text',svg:'mosfet_char',
   text:'[2024 Exam Q14a] The circuit above uses an RC low-pass filter (R and C) between the PWM generator and the MOSFET gate.\n\nExplain the function of the RC filter. Why is it needed for this measurement?',
   keywords:['dc','duty cycle','analog','average','linear','vgs','stable','convert','smooth','low pass','voltage'],
   minKeywords:3,
   ans_text:'The RC filter converts the PWM square wave into a steady DC analog voltage: V_gate = D × V_supply. The duty cycle D controls the DC voltage at the gate, giving a stable Vgs. This is needed because the MOSFET must operate in its linear/active region — you need a controlled, constant Vgs to measure the corresponding steady-state Ids and plot the VGS-IDS characteristic.',
   explanation:'Key concepts: (1) RC converts PWM → DC average voltage D×Vsupply. (2) Provides stable Vgs for measurement. (3) Allows MOSFET to operate in linear region rather than switching.'},
  {id:'t4open2',src:'2024',n:'14b',type:'open',subtype:'text',svg:'mosfet_char',
   text:'[2024 Exam Q14b] What would happen to the Ids measurement if the RC low-pass filter was LEFT OUT? What would the resulting measurement look like?',
   keywords:['switch','square wave','pwm','two states','fully on','fully off','binary','on and off','no curve','rapidly'],
   minKeywords:2,
   ans_text:'Without the RC filter, the MOSFET gate directly sees the PWM square wave. The MOSFET rapidly switches between fully OFF (Ids≈0) and fully ON (Ids=Isat) at the PWM frequency. The measurement shows only two discrete current levels — no smooth VGS-IDS curve. No useful characteristic can be obtained.',
   explanation:'Key concepts: (1) Gate sees square wave → MOSFET is either fully OFF or fully ON. (2) Two discrete Ids values only — 0 or Isat. (3) No linear region operation — VGS-IDS characteristic cannot be measured.'},
],

t1:raw`<div class="th">
<h4>The Drive System Chain</h4>
<p>Every electrical drive follows the same chain from energy source to mechanical output:</p>
<div class="hl"><strong>Source → Power Converter → Motor → Transmission → Load</strong><br>
Grid/Battery → H-bridge/Inverter → DC/BLDC/Stepper → Gearbox/Belt → Robot/Pump/Conveyor</div>
<p>The <strong>power converter</strong> is the brain — it controls how much energy flows from source to motor, and in which direction. The <strong>transmission</strong> (gearbox) adapts the motor's natural speed/torque to what the load needs.</p>

<h4>Open vs. Closed Loop</h4>
<ul><li><strong>Open loop:</strong> No sensor, no feedback. Simple and cheap. Works if the load is perfectly predictable. Example: stepper motor in a 3D printer. Risk: errors accumulate unchecked.</li>
<li><strong>Closed loop:</strong> A sensor measures the output → controller compares to setpoint → corrects the error. More accurate, robust to disturbances. Example: servo with encoder.</li></ul>
<div class="hl tip">💡 Closed loop is always better for precision — but requires a sensor and more complex control.</div>

<h4>Gearbox — The N² Rule ⭐</h4>
<p>A gearbox with ratio $N$ (where $N > 1$ means speed reduction / torque increase):</p>
<div class="hl">
$$\omega_{load} = \frac{\omega_{motor}}{N} \qquad T_{load} = T_{motor} \cdot N \cdot \eta$$
$$J_{ref} = \frac{J_{load}}{N^2} \quad \text{(reflected inertia at motor shaft)}$$
</div>
<p>The $N^2$ rule is the most important gearbox concept: inertia is divided by $N^2$, making the load feel much lighter to the motor. A gearbox with $N=4$ makes a load appear $16\times$ lighter!</p>

<div class="th ex"><div class="ex-title">📐 Example — Reflected Inertia</div>
$J_{motor} = 0.001\,\text{kg·m}^2$, $J_{load} = 0.016\,\text{kg·m}^2$, $N = 4$<br>
$J_{ref} = J_{load}/N^2 = 0.016/16 = \mathbf{0.001\,\text{kg·m}^2}$<br>
Total inertia at motor: $J_{tot} = J_{motor} + J_{ref} = 0.002\,\text{kg·m}^2$
</div>

<h4>Optimal Gear Ratio ⭐</h4>
<p>Maximum acceleration is achieved when reflected inertia equals motor inertia:</p>
<div class="hl">$$N_{opt} = \sqrt{\frac{J_{load}}{J_{motor}}}$$
At $N_{opt}$: $J_{tot} = 2 \cdot J_{motor}$ → $\alpha_{max} = \frac{T_{motor}}{2 \cdot J_{motor}}$</div>
<div class="th ex"><div class="ex-title">📐 Example — Optimal Gear Ratio</div>
$J_{load} = 0.009\,\text{kg·m}^2$, $J_{motor} = 0.001\,\text{kg·m}^2$<br>
$N_{opt} = \sqrt{0.009/0.001} = \sqrt{9} = \mathbf{3}$
</div>

<h4>Power & Efficiency</h4>
<div class="hl">$$P = T \cdot \omega \quad [W = N \cdot m \times rad/s]$$
$$\eta = \frac{P_{out}}{P_{in}} \qquad \omega\,[\text{rad/s}] = n\,[\text{RPM}] \times \frac{2\pi}{60}$$</div>
<ul><li>A gearbox always introduces losses: $\eta < 1$ → efficiency <em>decreases</em> with a gearbox</li>
<li>Output torque with losses: $T_{load} = T_{motor} \times N \times \eta$</li></ul>

<h4>Motor Thermal Model</h4>
<p>Motors generate heat from copper losses ($I^2 R$). Too much heat destroys the winding insulation.</p>
<div class="hl">$$P_{cu} = I^2 R_r \quad \text{(copper losses)}$$
$$\Delta T_{ss} = P_{total} \times R_{th} \quad \text{(steady-state temp rise)}$$
$$T(t) = \Delta T_\infty \left(1 - e^{-t/\tau_{th}}\right) \quad \text{(thermal transient)}$$</div>
<table><tr><th>Isolation Class</th><th>Max ΔT Rise</th><th>Use case</th></tr>
<tr><td>Class B</td><td>130°C</td><td>Standard motors</td></tr>
<tr><td>Class F</td><td>155°C</td><td>Improved motors</td></tr>
<tr><td>Class H</td><td>180°C</td><td>High-performance, drives</td></tr></table>

<p class="yt-label">▶ How a Gearbox Works – Gear Ratio Explained (2025)</p>

<p class="yt-label">▶ How does an Electric Motor work? — Jared Owen</p>
</div>`,

<h4>Why Sensors Matter</h4>
<div class="hl"><strong>You can only control what you measure.</strong><br>
The four things we measure in a drive system: Position · Speed · Current/Torque · Temperature</div>
<h4>Key Sensor Specifications</h4>
<ul>
<li><strong>Accuracy:</strong> How close the measured value is to the true value. Systematic error.</li>
<li><strong>Resolution:</strong> The smallest change that can be detected. A 12-bit ADC on ±10V has resolution of 20V/4096 ≈ 4.9 mV.</li>
<li><strong>Linearity:</strong> The output should change proportionally to the input across the full range.</li>
<li><strong>Repeatability (Precision):</strong> Same input → same output, every time. High repeatability ≠ high accuracy (can be consistently wrong).</li>
<li><strong>Sensitivity:</strong> Output change per unit input change (e.g., mV/A for a current sensor).</li>
<li><strong>Bandwidth:</strong> How fast the sensor can respond to changes.</li></ul>

<h4>Incremental Encoder ⭐</h4>
<p>An optical incremental encoder uses a grating disc and two photodetectors to generate position pulses:</p>
<div class="hl">
<strong>Channel A:</strong> PPR pulses per revolution (basic resolution)<br>
<strong>Channel B:</strong> 90° phase-shifted — direction detection (A leads B = CW, B leads A = CCW)<br>
<strong>Channel Z:</strong> One pulse per revolution — used for homing (absolute reference)<br>
$$\text{Quadrature resolution} = 4 \times PPR \quad \text{(count all edges)}$$
</div>
<div class="th ex"><div class="ex-title">📐 Example — Encoder Resolution</div>
Encoder: 50 PPR<br>
Quadrature: $4 \times 50 = \mathbf{200}$ positions/revolution<br>
Angular resolution: $360° / 200 = \mathbf{1.8°}$ per count
</div>
<p>High-end encoders use the <strong>Moiré fringe principle</strong> — two slightly-offset gratings create sinusoidal fringe patterns, giving sub-micron position resolution with SIN/COS interpolation.</p>
<div class="hl warn">⚠️ Exam: "Absolute encoders give absolute position after power-on." Incremental encoders need homing first!</div>

<h4>Current Sensors</h4>
<p>Three main types — each with trade-offs in accuracy, isolation, and cost:</p>
<table>
<tr><th>Type</th><th>Formula</th><th>Isolation</th><th>Notes</th></tr>
<tr><td>Shunt resistor</td><td>$V = I \cdot R_{shunt}$</td><td>❌ None</td><td>Simple, cheap, power loss = $I^2 R$</td></tr>
<tr><td>Hall open-loop (ACS712)</td><td>$V_{out} = V_{ref} + S \cdot I$</td><td>✅ Yes</td><td>S=185 mV/A (±5A), offset drift at temperature</td></tr>
<tr><td>LEM closed-loop (HO40)</td><td>$V_{out} = V_{ref} + S \cdot (I/N_p)$</td><td>✅ Yes</td><td>Secondary winding cancels flux → very accurate</td></tr>
<tr><td>Current transformer</td><td>$I_s = I_p / N$</td><td>✅ Yes</td><td>AC only — needs changing magnetic flux!</td></tr>
</table>
<p>The <strong>ACS712</strong> (open-loop Hall): at zero current, $V_{out} = V_{cc}/2$ (2.5V on 5V supply). Sensitivity = 185 mV/A for the 5A version.</p>
<p>The <strong>LEM zero-flux (HO40)</strong>: a secondary winding with a current source drives flux to zero. The secondary current is proportional to primary current × winding ratio. Much better accuracy and bandwidth than open-loop.</p>

<h4>Temperature Sensors</h4>
<table>
<tr><th>Sensor</th><th>Output</th><th>Characteristic</th><th>Best use</th></tr>
<tr><td>PTC thermistor</td><td>Resistance ↑ with T</td><td>Nonlinear</td><td>Motor winding protection (binary trip)</td></tr>
<tr><td>NTC thermistor</td><td>Resistance ↓ with T</td><td>Nonlinear</td><td>General temperature measurement</td></tr>
<tr><td>RTD (Pt100)</td><td>Resistance ↑ with T</td><td>Linear ~0.385 Ω/°C</td><td>Precise lab/industrial measurement</td></tr>
<tr><td>Thermocouple</td><td>Voltage (µV/°C)</td><td>Linear</td><td>High-temp measurement, large ranges</td></tr>
</table>
<div class="hl warn">⚠️ Classic exam trap: A thermocouple generates a <strong>VOLTAGE</strong> (Seebeck effect) — NOT a current!</div>

<h4>DC Brush Motor — Equivalent Circuit</h4>
<p>The DC motor can be modelled as a voltage source (back-EMF) in series with a resistor and inductor:</p>
<div class="hl">$$V = E + I \cdot R_r + L \frac{dI}{dt}$$
Back-EMF: $E = k \cdot \omega$ &nbsp;&nbsp;|&nbsp;&nbsp; Torque: $T = k \cdot I$<br>
Steady-state speed: $\omega = \dfrac{V - I \cdot R_r}{k}$</div>
<div class="th">
<div class="def"><span class="sym">$k$</span><span class="desc">Motor constant [Nm/A = Vs/rad]. Same value for torque and back-EMF!</span></div>
<div class="def"><span class="sym">$R_r$</span><span class="desc">Rotor winding resistance [Ω]. Main source of heat.</span></div>
<div class="def"><span class="sym">$\omega_0$</span><span class="desc">No-load speed: $V/k$ — max speed at zero torque</span></div>
<div class="def"><span class="sym">$T_{stall}$</span><span class="desc">Stall torque: $k \cdot V/R_r$ — max torque at zero speed</span></div>
</div>
<div class="th ex"><div class="ex-title">📐 Example — DC Motor Speed</div>
$V = 24\,\text{V}$, $R_r = 2\,\Omega$, $k = 0.15\,\text{Vs/rad}$, $I = 3\,\text{A}$<br>
$\omega = (V - I \cdot R)/k = (24 - 6)/0.15 = 18/0.15 = \mathbf{120\,\text{rad/s}}$<br>
RPM: $120 \times 60/(2\pi) \approx 1146\,\text{RPM}$
</div>

<h4>Speed–Torque Curve</h4>
<p>The DC motor has a <strong>linear speed–torque characteristic</strong>:</p>
<div class="hl">$$\omega = \frac{V}{k} - \frac{R_r}{k^2} \cdot T$$
At no load ($T=0$): $\omega = \omega_0 = V/k$ &nbsp;&nbsp;|&nbsp;&nbsp; At stall ($\omega=0$): $T_{stall} = kV/R_r$</div>
<p>The slope is $-R_r/k^2$. A larger $k$ or smaller $R_r$ = flatter curve = better speed regulation under load.</p>

<h4>Time Constants</h4>
<ul>
<li><strong>Electrical:</strong> $\tau_e = L_r/R_r$ — how fast current responds to voltage changes (ms range)</li>
<li><strong>Mechanical:</strong> $\tau_m = J \cdot R_r / k^2$ — how fast speed responds to torque (10s–100s ms)</li>
</ul>

<h4>BLDC Motor (Brushless DC) ⭐</h4>
<p>BLDC = permanent magnet rotor, copper windings on stator. No brushes → no wear, no sparks.</p>
<div class="hl">Commutation done electronically (not mechanically).<br>
6-step commutation: at each step, 2 of 3 phases are energised based on rotor position.<br>
<strong>Hall sensors or encoder are mandatory</strong> — without them, the controller doesn't know rotor position.</div>
<ul>
<li>Windings on stator → heat flows directly to case → excellent thermal performance</li>
<li>No friction from brushes → high efficiency, long life</li>
<li>FOC (Field-Oriented Control): controls current vector in d-q frame → maximum torque per amp</li>
</ul>

<h4>Stepper Motor</h4>
<p>A stepper motor moves in discrete steps using toothed stator and rotor, no position sensor needed.</p>
<div class="hl">Full step: $\mathbf{200\,\text{steps/rev}}$ → $1.8°/\text{step}$<br>
Half step: $400\,\text{steps/rev}$ → $0.9°/\text{step}$<br>
Microstepping: $\times 8$, $\times 16$, $\times 32$ — smoother motion but no higher accuracy</div>
<ul>
<li>Open-loop — simple, no encoder needed. But loses steps if overloaded!</li>
<li>Full rated current flows even when stationary → <strong>very poor thermal efficiency</strong></li>
<li>Holding torque is well-defined — good for positioning without brakes</li>
</ul>
<div class="hl warn">⚠️ Stepper: always draws full current when holding position → heats up even when not moving!</div>

<h4>Motor Type Comparison</h4>
<table>
<tr><th>Motor</th><th>Controller</th><th>Feedback</th><th>Thermal</th><th>Best for</th></tr>
<tr><td>DC brush</td><td>Simple (H-bridge)</td><td>Optional</td><td>OK</td><td>Simple speed control</td></tr>
<tr><td>BLDC</td><td>Electronic commutation</td><td>Required</td><td>Excellent</td><td>High performance</td></tr>
<tr><td>Stepper</td><td>Open-loop driver</td><td>None needed</td><td>Poor ⚠️</td><td>Low-cost positioning</td></tr>
<tr><td>Induction</td><td>VFD (complex)</td><td>Optional</td><td>Excellent</td><td>Industrial AC drives</td></tr>
</table>

<h4>H-Bridge — Motor Direction Control</h4>
<p>An H-bridge uses 4 transistors (usually MOSFETs) arranged in an "H" shape to drive a motor in both directions:</p>
<div class="hl">
<strong>Q1 + Q4 ON:</strong> Current flows Motor+ → Motor− → Forward rotation<br>
<strong>Q2 + Q3 ON:</strong> Current flows Motor− → Motor+ → Reverse rotation<br>
<strong>Q1 + Q3 ON (or Q2+Q4):</strong> Motor terminals shorted → Active braking<br>
<strong>All OFF:</strong> Motor freewheels (coasts)
</div>
<p><strong>Freewheeling diodes</strong> (body diodes of MOSFETs) are critical: when a switch opens, the motor inductance forces current to continue. Without diodes, this creates a voltage spike that destroys the transistors.</p>
<p><strong>Dead time:</strong> A brief delay between turning one transistor OFF and the complementary one ON. Prevents <em>shoot-through</em> — a momentary short-circuit from supply to ground through both transistors. Typically 100 ns – 1 µs.</p>

<h4>PWM Speed Control</h4>
<p>Pulse Width Modulation (PWM) controls motor speed by rapidly switching the motor voltage ON and OFF:</p>
<div class="hl">$$V_{avg} = D \times V_{dc} \quad \text{where } D = \frac{t_{on}}{T_{period}} \in [0,1]$$
Current ripple: $\Delta I = \dfrac{V_{dc} \cdot D \cdot (1-D)}{L \cdot f_{PWM}}$</div>
<ul>
<li>$D = 0$: motor off (no average voltage). $D = 1$: full voltage.</li>
<li>Higher $f_{PWM}$ → less current ripple → smoother torque → less motor noise</li>
<li>Typical: $f_{PWM} = 10$–$20\,\text{kHz}$ (above human hearing)</li>
<li>Motor inductance $L$ acts as a natural low-pass filter on the current</li>
</ul>
<div class="th ex"><div class="ex-title">📐 Example — PWM Average Voltage</div>
$V_{dc} = 24\,\text{V}$, $D = 0.6$ (60% duty cycle)<br>
$V_{avg} = 0.6 \times 24 = \mathbf{14.4\,\text{V}}$<br>
At 75% duty: $V_{avg} = 0.75 \times 24 = 18\,\text{V}$
</div>

<h4>RC Low-Pass Filter on MOSFET Gate</h4>
<p>To measure MOSFET characteristics ($V_{GS}$ vs $I_{DS}$), you need a stable DC voltage at the gate. But a microcontroller can only produce PWM:</p>
<div class="hl">PWM square wave → RC low-pass filter → Stable DC voltage<br>
$$V_{gate} = D \times V_{supply}$$
Without RC: gate sees square wave → MOSFET switches fully ON/OFF → no linear region!</div>
<p>The RC time constant $\tau = RC$ must be much larger than $T_{PWM}$ to smooth the ripple. Result: by changing duty cycle $D$, you get a continuously variable $V_{GS}$ from 0 to $V_{supply}$.</p>

<h4>MOSFET Operating Regions</h4>
<table>
<tr><th>Region</th><th>Condition</th><th>Behaviour</th><th>Use</th></tr>
<tr><td>Cutoff</td><td>$V_{GS} < V_{th}$</td><td>$I_{DS} \approx 0$ (off)</td><td>Switch OFF</td></tr>
<tr><td>Linear / Ohmic</td><td>$V_{DS} < V_{GS} - V_{th}$</td><td>Acts as resistor $R_{DS,on}$</td><td>Switch ON</td></tr>
<tr><td>Saturation</td><td>$V_{DS} > V_{GS} - V_{th}$</td><td>$I_{DS}$ controlled by $V_{GS}$ only</td><td>Amplifier / linear mode</td></tr>
</table>
<ul>
<li><strong>Threshold voltage $V_{th}$:</strong> read from VGS-IDS graph as the x-intercept (~1–3V)</li>
<li><strong>$R_{DS,on}$:</strong> on-resistance in ohmic region — contributes to conduction losses $P = I^2 R_{DS,on}$</li>
</ul>

<h4>Control Loop Structure</h4>
<p>Drive systems use cascaded (nested) control loops. Each inner loop must be faster than its outer loop:</p>
<div class="hl">
<strong>Outer:</strong> Position loop — bandwidth ~10 Hz, setpoint: position [rad]<br>
<strong>Middle:</strong> Speed loop — bandwidth ~100 Hz, setpoint: velocity [rad/s]<br>
<strong>Inner:</strong> Current/Torque loop — bandwidth ~1 kHz, setpoint: current [A]<br>
Rule: each inner loop 3–10× faster than the outer loop.
</div>

t5:raw`<div class="th">
<h4>SCR (Silicon Controlled Rectifier) / Thyristor ⭐</h4>
<p>The SCR is a 4-layer PNPN semiconductor with 3 terminals. It is the original power electronics device, used for controlled rectification of AC to DC.</p>
<div class="hl">
<strong>Terminals:</strong> Anode (A) — Cathode (K) — Gate (G)<br>
<strong>Turn ON:</strong> Apply positive gate pulse while $V_{AK} > 0$ (anode positive)<br>
<strong>Turn OFF:</strong> Current falls below $I_{hold}$ — in AC: happens automatically at zero crossing<br>
<strong>Once ON: the gate has no further control</strong> — SCR latches in conducting state!
</div>
<p>SCRs are used as <strong>controlled rectifiers</strong>: by delaying the gate pulse by firing angle $\alpha$ after the zero crossing, you control how much of each AC half-cycle is passed to the load:</p>
<div class="hl">$$V_{avg} = \frac{V_{pk}}{2\pi}(1 + \cos\alpha)$$
$\alpha = 0°$: full voltage $V_{avg} = V_{pk}/\pi$&nbsp;&nbsp;|&nbsp;&nbsp;$\alpha = 90°$: half&nbsp;&nbsp;|&nbsp;&nbsp;$\alpha = 180°$: zero</div>
<div class="th ex"><div class="ex-title">📐 Example — Controlled Rectifier</div>
$V_{pk} = 325\,\text{V}$ (230 Vrms), $\alpha = 60°$<br>
$V_{avg} = \frac{325}{2\pi}(1 + \cos 60°) = \frac{325}{2\pi}(1 + 0.5) = \frac{325 \times 1.5}{6.283} \approx \mathbf{77.6\,\text{V}}$
</div>

<h4>TRIAC</h4>
<p>A TRIAC is essentially two SCRs in anti-parallel — it conducts in <strong>both directions</strong>:</p>
<ul>
<li>Used for AC power control: lamp dimmers, AC motor speed control, SSRs</li>
<li>Can be triggered in all four quadrants (both polarities of V and gate signal)</li>
<li>Turn OFF only happens at AC zero crossing — cannot control DC loads!</li>
</ul>
<div class="hl warn">⚠️ TRIAC cannot switch OFF a DC load — zero crossing never comes with DC!</div>

<h4>EMC (Electromagnetic Compatibility) ⭐</h4>
<p>EMC problems arise when one circuit disturbs another. The three-element model:</p>
<div class="hl"><strong>Source → Coupling Path → Victim</strong><br>
Break <em>any one</em> of the three links to solve the EMC problem.</div>
<ul>
<li><strong>Reduce source:</strong> Slow down switching edges (reduce dV/dt), add snubbers, use spread-spectrum PWM</li>
<li><strong>Break coupling path:</strong> Shielding, twisted-pair cables, proper PCB layout, separation of power and signal grounds</li>
<li><strong>Harden victim:</strong> Filtering at inputs, decoupling capacitors, ferrite beads, TVS diodes</li>
<li><strong>Common-mode current</strong> is the dominant EMC problem in variable-speed drives — return currents flow through parasitic capacitances to chassis ground</li>
</ul>

<h4>Transmission Lines ⭐</h4>
<p>At high frequencies or fast edges, a wire is no longer just a wire — it becomes a <strong>transmission line</strong> with distributed L and C:</p>
<div class="hl">Characteristic impedance: $Z_0 = \sqrt{L'/C'}$<br>
Propagation velocity: $v_p = \frac{1}{\sqrt{L' C'}} \approx 0.66c$ for RG-58 coax<br>
Reflection coefficient: $\Gamma = \dfrac{Z_L - Z_0}{Z_L + Z_0}$<br>
<strong>Matched load:</strong> $Z_L = Z_0$ → $\Gamma = 0$ → no reflections!</div>

<p><strong>The 10% rule:</strong> You must consider transmission line effects when:</p>
<div class="hl">$$\ell \geq 0.1 \times v_p \times t_{rise}$$
Spatial extent of the edge = $v_p \times t_{rise}$. If cable is ≥ 10% of this, use TL rules.</div>
<div class="th ex"><div class="ex-title">📐 Example — 10% Rule</div>
$t_{rise} = 0.5\,\text{ns}$, $v_p = 0.66 \times 3 \times 10^8 = 1.98 \times 10^8\,\text{m/s}$<br>
Spatial extent: $v_p \times t_{rise} = 1.98 \times 10^8 \times 0.5 \times 10^{-9} = 0.099\,\text{m} = 9.9\,\text{cm}$<br>
10% rule threshold: $0.1 \times 9.9\,\text{cm} = \mathbf{9.9\,\text{mm}}$<br>
Any cable longer than ~1 cm needs TL treatment for this edge!
</div>

<p><strong>L' from datasheet:</strong> If you know $Z_0$ and $C'$, use $L' = Z_0^2 \times C'$.</p>

<h4>Skin Effect</h4>
<ul>
<li>At high frequency, current concentrates at the conductor surface within depth $\delta = \sqrt{2\rho/(\omega\mu)}$</li>
<li>Effective resistance increases with $\sqrt{f}$ — becomes significant above ~100 kHz for copper</li>
</ul>

<h4>Transistors as Switches — BJT</h4>
<p>A BJT (NPN) switches between cutoff (OFF) and saturation (ON) — never operated in the linear region as a switch:</p>
<div class="hl">
<strong>ON (Saturation):</strong> $I_B \geq I_C/\beta$ &nbsp;→&nbsp; $V_{CE} \approx 0.2\,\text{V}$, acts as closed switch<br>
<strong>OFF (Cutoff):</strong> $I_B = 0$ &nbsp;→&nbsp; $I_C \approx 0$, acts as open switch<br>
$$R_B = \frac{V_{in} - V_{BE}}{I_B} \quad (V_{BE} \approx 0.7\,\text{V for silicon NPN})$$
</div>
<p>Design rule: choose $I_B$ at least $5 \times I_C/\beta$ to guarantee saturation (overdrive factor of 5).</p>

<h4>MOSFET as Switch ⭐</h4>
<p>MOSFETs are voltage-controlled — gate draws almost no current. Key placement rules:</p>
<div class="hl">
<strong>N-MOSFET (NMOS):</strong> ON when $V_{GS} > V_{th}$ — best as <em>low-side switch</em> (Source to GND)<br>
<strong>P-MOSFET (PMOS):</strong> ON when $V_{GS} < -V_{th}$ — natural <em>high-side switch</em> (Source to supply)<br>
<strong>N-MOSFET high-side:</strong> requires gate driver / bootstrap circuit (gate must go above supply!)
</div>
<ul>
<li>N-MOSFET is preferred (lower $R_{DS,on}$ for same die size) — but high-side driving is more complex</li>
<li>$P_{cond} = I^2 \times R_{DS,on}$ — conduction loss. $P_{sw} \propto f_{sw} \times V \times I$ — switching loss</li>
</ul>

<h4>Optocoupler (CNY17) ⭐</h4>
<p>An optocoupler transmits signals using light across a galvanic isolation barrier. This breaks ground loops and protects microcontrollers from high-voltage surges:</p>
<div class="hl">
<strong>LED ON</strong> → light activates phototransistor → phototransistor conducts → output <strong>LOW</strong> (≈0V)<br>
<strong>LED OFF</strong> → no light → phototransistor OFF → pull-up resistor → output <strong>HIGH</strong> (= V<sub>cc</sub>)<br>
⚠️ Output is <strong>INVERTED</strong> relative to the input LED signal!<br>
$$R_{LED} = \frac{V_{supply} - V_F}{I_F} \quad (V_F \approx 1.2\text{–}1.4\,\text{V,}\; I_F \approx 10\text{–}20\,\text{mA})$$
</div>
<div class="th ex"><div class="ex-title">📐 Example — LED Resistor</div>
$V_{supply} = 5\,\text{V}$, $V_F = 1.2\,\text{V}$, $I_F = 10\,\text{mA}$<br>
$R_{LED} = (5 - 1.2) / 0.010 = 3.8 / 0.010 = \mathbf{380\,\Omega}$
</div>

<h4>Solid-State Relay (SSR)</h4>
<p>An SSR is an optocoupler + output power switch, in a compact package with full isolation:</p>
<table>
<tr><th>Output type</th><th>Load type</th><th>Turn OFF</th></tr>
<tr><td>TRIAC output</td><td>AC loads only</td><td>Zero-crossing only</td></tr>
<tr><td>MOSFET output</td><td>DC loads</td><td>Any time (controlled)</td></tr>
</table>

<h4>Digital Input Protection</h4>
<p>Microcontroller I/O pins are fragile. Two protection mechanisms:</p>
<ul>
<li><strong>Clamping diodes:</strong> Built into every MCU pin. Clamp input voltage to [GND−0.7V, Vcc+0.7V]. Protects against ESD and overvoltage.</li>
<li><strong>Series resistor:</strong> Limits current if clamp diode activates. Also filters high-frequency noise with pin capacitance.</li>
</ul>
<p><strong>Source vs Sink current:</strong></p>
<ul>
<li><strong>Source mode:</strong> Pin = HIGH, provides current. Load connected from pin to GND.</li>
<li><strong>Sink mode:</strong> Pin = LOW, accepts current. Load connected from Vcc to pin.</li>
</ul>

<h4>Schmitt Trigger</h4>
<p>A comparator with <strong>positive feedback</strong> creates hysteresis — two different switching thresholds:</p>
<div class="hl">Threshold going UP: $V_{trip+}$ (higher)<br>
Threshold going DOWN: $V_{trip-}$ (lower)<br>
Hysteresis band: $V_{hyst} = V_{trip+} - V_{trip-}$<br>
→ Prevents <strong>chattering</strong> near the threshold from noise</div>

<h4>Motion Profiles ⭐</h4>
<p>A motion profile defines how position, velocity, and acceleration change over time:</p>
<div class="hl">
<strong>Trapezoidal velocity profile = Time-optimal</strong> for bounded velocity and acceleration<br>
3 phases: Accelerate (+$a_{max}$) → Cruise ($v_{max}$) → Decelerate ($-a_{max}$)<br>
$$t_{acc} = \frac{v_{max}}{a_{max}} \qquad x_{acc} = \frac{1}{2} a_{max} t_{acc}^2$$
</div>
<div class="hl warn">⚠️ Exam trap: "Parabolic velocity profile is time-optimal" → <strong>FALSE</strong>! Trapezoidal is optimal.</div>

<p><strong>S-curve profile:</strong> Limits the rate of change of acceleration (jerk). Smoother motion, less vibration — but takes more time than trapezoidal for the same move.</p>
<div class="th ex"><div class="ex-title">📐 Example — Trapezoidal Profile</div>
$v_{max} = 2\,\text{m/s}$, $a_{max} = 4\,\text{m/s}^2$<br>
$t_{acc} = 2/4 = 0.5\,\text{s}$ &nbsp;|&nbsp; $x_{acc} = \frac{1}{2} \times 4 \times 0.5^2 = 0.5\,\text{m}$<br>
Move distance 3 m: cruise distance = $3 - 2 \times 0.5 = 2\,\text{m}$, cruise time = $2/2 = 1\,\text{s}$<br>
Total time: $0.5 + 1 + 0.5 = \mathbf{2\,\text{s}}$
</div>

<h4>PID Controller ⭐</h4>
<p>The PID controller combines three terms, each correcting a different aspect of the error:</p>
<div class="hl">$$u(t) = K_p \cdot e(t) + K_i \int e\,dt + K_d \frac{de}{dt}$$
<strong>P:</strong> Proportional to error — fast response, but leaves steady-state error<br>
<strong>I:</strong> Integral of error — eliminates steady-state error (at the cost of slower response)<br>
<strong>D:</strong> Derivative of error — damps oscillations, but very sensitive to noise</div>

<table>
<tr><th>Term</th><th>Effect when increased</th><th>Side effect</th></tr>
<tr><td>$K_p$ ↑</td><td>Faster response, less steady-state error</td><td>Risk of overshoot / oscillation</td></tr>
<tr><td>$K_i$ ↑</td><td>Eliminates steady-state error</td><td>Slower, risk of windup / oscillation</td></tr>
<tr><td>$K_d$ ↑</td><td>Damps overshoot, faster settling</td><td>Amplifies measurement noise</td></tr>
</table>
<div class="hl tip">✅ With $K_i > 0$: PID eliminates steady-state position error for a constant setpoint.</div>
<div class="hl warn">⚠️ Derivative term amplifies high-frequency sensor noise — usually filtered in practice.</div>

<h4>Feedforward Control</h4>
<p>Feedforward adds an open-loop contribution based on the desired trajectory — it does NOT use feedback:</p>
<div class="hl">$$u_{ff} = K_{ff} \cdot \dot{r}(t) \quad \text{(velocity feedforward)}$$
Reduces tracking error <em>during motion</em>.<br>
<strong>Does NOT affect stability</strong> — open-loop by definition. Cannot cause oscillation.</div>

<h4>Cascaded Control Loops</h4>
<p>High-performance drive systems use nested loops where the inner loop output becomes the outer loop's setpoint:</p>
<div class="hl">
<strong>Position loop</strong> (outer, ~10 Hz): setpoint = target position → output = velocity reference<br>
<strong>Speed loop</strong> (middle, ~100 Hz): setpoint = velocity → output = current reference<br>
<strong>Current loop</strong> (inner, ~1–10 kHz): setpoint = current → output = PWM duty cycle<br><br>
Rule: each inner loop must be <strong>3–10× faster</strong> than the loop above it.
</div>

<h4>Thermal Calculations ⭐ (Open Questions on Exam)</h4>
<p>The three-step thermal calculation appears every year as an open question:</p>
<div class="hl">
<strong>Step 1:</strong> Maximum allowable losses: $P_{total} = \Delta T_{max} / R_{th}$<br>
<strong>Step 2:</strong> Copper losses available: $P_{cu} = P_{total} - P_{nl}$ (subtract no-load losses)<br>
<strong>Step 3:</strong> Nominal current: $I_{nom} = \sqrt{P_{cu} / R_r}$
</div>
<div class="th ex"><div class="ex-title">📐 Example — Nominal Current (Isolation Class H)</div>
$\Delta T_{max} = 180°C$, $R_{th} = 2°C/W$, $R_r = 1.5\,\Omega$, $P_{nl} = 18\,\text{W}$<br>
$P_{total} = 180/2 = 90\,\text{W}$<br>
$P_{cu} = 90 - 18 = 72\,\text{W}$<br>
$I_{nom} = \sqrt{72/1.5} = \sqrt{48} \approx \mathbf{6.93\,\text{A}}$
</div>
<div class="hl">Thermal transient — time to reach temperature $\Delta T$:<br>
$$t = -\tau_{th} \ln\!\left(1 - \frac{\Delta T}{\Delta T_\infty}\right) \qquad \text{where } \Delta T_\infty = P_{total} \times R_{th}$$</div>

<h4>Regenerative Braking</h4>
<ul>
<li>Motor acts as generator — kinetic energy returned to the DC bus</li>
<li>Requires a <em>4-quadrant drive</em> (H-bridge or active rectifier) to accept return current</li>
<li>Even with regeneration: $I^2 R_r$ copper losses still heat the rotor during braking</li>
</ul>

function isCorrect(q) {
  const ua = answered[q.id];
  if (ua === undefined) return false;
  if (q.type === 'open') {
    if (q.subtype === 'number') {
      const num = parseFloat(String(ua).replace(',', '.'));
      if (isNaN(num)) return false;
      return Math.abs(num - q.ans_val) / Math.abs(q.ans_val) <= (q.tolerance || 0.1);
    } else {
      const lower = String(ua).toLowerCase();
      const hits = (q.keywords||[]).filter(kw => lower.includes(kw.toLowerCase()));
      return hits.length >= (q.minKeywords || 2);
    }
  }
  return ua === q.ans;
}

function answerOpen(qid, tid) {
  if (answered[qid] !== undefined) return;
  const input = document.getElementById('oa_'+qid);
  if (!input || !input.value.trim()) return;
  answered[qid] = input.value.trim();
  updateProgress();
  const qs = tid==='exam' ? Object.values(QB).flat() : (QB[tid]||[]);
  const renderEl = document.getElementById('content');
  if (page==='exam') renderExam(renderEl);
  else renderQuiz(renderEl, qs, tid);
  setTimeout(()=>{ const el=document.getElementById('qb_'+qid); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 80);
}

// ─────────────────────────────────────────────
function calcProgress() {
  const tids = ['t1','t2','t3','t4','t5','t6','t7'];
  let total=0, correct=0;
  tids.forEach(tid => {
    (QB[tid]||[]).forEach(q => {
      total++;
      if (isCorrect(q)) correct++;
    });
  });
  return {total, correct};
}
function updateProgress() {
  const {total, correct} = calcProgress();
  const pct = total ? Math.round(100*correct/total) : 0;
  document.getElementById('pbf').style.width = pct+'%';
  document.getElementById('pbl').textContent = correct+' / '+total+' questions mastered';
}

function buildSidebar() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TOPICS.forEach(t => {
    const qs = QB[t.id]||[];
    const done = qs.length ? qs.filter(q=>isCorrect(q)).length : 0;
    const d = document.createElement('div');
    d.className = 'ni'+(page===t.id?' active':'');
    d.onclick = () => navigate(t.id);
    d.innerHTML = `<span class="nn">${t.num||t.icon}</span>
      <span style="flex:1">${t.label}</span>
      ${qs.length ? `<span class="nct">${done}/${qs.length}</span>` : ''}`;
    nav.appendChild(d);
  });
}

    {k:'formulas', label:'🔢 Formulas'},

function renderContent() {
  const el = document.getElementById('content');
  if (page==='home') { renderHome(el); return; }
  if (page==='exam') { renderExam(el); return; }
  switch(tab) {
    case 'theory':   renderTheory(el); break;
    case 'flash':    renderFlash(el);  break;
    case 'quiz':     renderQuiz(el, QB[page]||[], page); break;
    case 'formulas': renderFormulas(el); break;
  }
}

function applyMath(el) {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(el, {

        {left:'$',  right:'$',  display:false},

      throwOnError: false,

  } else {

function openResultHTML(q) {
  const ua = answered[q.id];
  const ok = isCorrect(q);
  if (q.subtype === 'number') {
    return `<div class="open-result ${ok?'ok':'bad'}">
      <div class="or-header">${ok?'✅ Correct!':'❌ Incorrect'}</div>
      Your answer: <strong>${ua} ${q.unit||''}</strong> — Expected: <strong>${q.ans_val} ${q.unit||''}</strong>
      <div class="open-model"><strong>Solution steps</strong>
        <p>${(q.steps||[]).map(s=>`<em>${s.n}:</em> ${s.f}`).join(' → ')}</p>
        <p>${q.explanation||''}</p>
      </div>
    </div>`;
  } else {
    const lower = String(ua).toLowerCase();
    const kwHtml = (q.keywords||[]).map(kw=>{
      const hit = lower.includes(kw.toLowerCase());
      return `<span class="kw-tag ${hit?'kw-hit':'kw-miss'}">${kw}</span>`;
    }).join('');
    return `<div class="open-result ${ok?'ok':'bad'}">
      <div class="or-header">${ok?'✅ Good answer! Key concepts found:':'❌ Missing key concepts:'}</div>
      <div style="margin:6px 0">${kwHtml}</div>
      <div class="open-yours"><em>Your answer:</em> ${ua}</div>
      <div class="open-model"><strong>Model Answer</strong><p>${q.ans_text||q.explanation||''}</p></div>
    </div>`;
  }
}

function openInputHTML(q, tid) {
  if (q.subtype === 'number') {
    return `<div class="open-num-wrap">
      <input type="text" class="open-num" id="oa_${q.id}" placeholder="0.000" inputmode="decimal">
      <span class="open-unit">${q.unit||''}</span>
      <button class="btn btn-p" onclick="answerOpen('${q.id}','${tid}')">Submit</button>
    </div>`;
  } else {
    return `<div class="open-area">
      <textarea class="open-input" id="oa_${q.id}" placeholder="Write your answer here — explain your reasoning..." rows="5"></textarea>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-p" onclick="answerOpen('${q.id}','${tid}')">Submit Answer</button>
        <span style="font-size:.72rem;color:var(--text2)">Key concepts will be checked automatically</span>
      </div>
    </div>`;
  }
}

function renderQuiz(el, qs, tid) {
  if (!qs.length) { el.innerHTML='<div class="card"><h3>🎯 Quiz</h3><p style="color:var(--text2)">No questions yet for this topic.</p></div>'; return; }
  const done = qs.filter(q=>answered[q.id]!==undefined).length;
  const correct = qs.filter(q=>isCorrect(q)).length;
  const t = TOPICS.find(x=>x.id===tid)||{label:'All Topics'};

  let html = `<div class="card"><h3>🎯 Quiz — ${t.label}</h3>`;
  if (done>0) {
    const pct = Math.round(100*correct/qs.length);
    html += `<div class="scorebar">
      <div class="sc"><div class="sv">${correct}/${qs.length}</div><div class="sl">Correct</div></div>
      <div class="sc"><div class="sv">${done}/${qs.length}</div><div class="sl">Answered</div></div>
      <div class="sc"><div class="sv" style="color:${pct>=70?'var(--green)':'var(--red)'}">${pct}%</div><div class="sl">Score</div></div>
      <button class="btn btn-o" style="margin-left:auto" onclick="resetQuiz('${tid}')">↺ Reset</button>
    </div>`;
  }

  qs.forEach((q, qi) => {
    const ua = answered[q.id];
    const isAnswered = ua !== undefined;
    const typeLabel = q.type==='calc'?'<span class="qtype calc">CALC</span>'
      :q.type==='diag'?'<span class="qtype diag">DIAGRAM</span>'
      :q.type==='open'?'<span class="qtype open">OPEN</span>':'';

    html += `<div class="qbox" id="qb_${q.id}">
      <div class="qhead">
        <span class="qnum">Q${qi+1}</span>
        <span class="qsrc">${q.src} · Q${q.n}</span>
        ${typeLabel}
        <span style="flex:1;margin-left:8px" class="qtxt">${q.text.replace(/\n/g,'<br>')}</span>
      </div>
      <div class="qbody">
        ${q.svg ? `<div class="qdiag">${SVG[q.svg]||''}</div>` : ''}
        ${q.type==='open' ? (isAnswered ? openResultHTML(q) : openInputHTML(q,tid)+hintHTML(q.id))
          : `<div class="opts">
          ${q.opts.map((opt,oi)=>{
            let cls='opt';
            if(isAnswered){ cls+=' dis'; if(oi===q.ans) cls+=' ok'; else if(oi===ua) cls+=' bad'; }
            return `<div class="${cls}" onclick="answer('${q.id}',${oi},${q.ans},'${tid}')">
              <span class="ol">${String.fromCharCode(65+oi)})</span><span>${opt}</span>
            </div>`;
          }).join('')}
        </div>
        ${!isAnswered ? hintHTML(q.id) : ''}
        <div class="exp${isAnswered?' show':''}" id="exp_${q.id}">${q.explanation||''}</div>
        ${isAnswered && q.steps ? `<div class="steps">${q.steps.map(s=>`<div class="step"><div class="sn">${s.n}</div><code class="sf">${s.f}</code></div>`).join('')}</div>` : ''}`}
      </div>
    </div>`;
  });

  html += `<div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn btn-o" onclick="resetQuiz('${tid}')">↺ Reset Quiz</button>
  </div></div>`;
  el.innerHTML = html;
}

function answer(qid, chosen, correct, tid) {
  if (answered[qid] !== undefined) return;
  answered[qid] = chosen;
  updateProgress();
  // Re-render
  const qs = tid==='exam_all' ? Object.values(QB).flat() : (QB[tid]||[]);
  renderQuiz(document.getElementById('content'), qs, tid==='exam_all'?'exam':tid);
  // Scroll to question
  setTimeout(()=>{ const el=document.getElementById('qb_'+qid); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); },80);
}

function resetQuiz(tid) {
  const qs = QB[tid]||[];
  qs.forEach(q=>delete answered[q.id]);
  updateProgress();
  renderContent();
}

function renderFormulas(el) {
  const fmls = FMLS[page]||[];
  const t = TOPICS.find(x=>x.id===page);
  el.innerHTML = `<div class="card"><h3>🔢 Formulas — ${t.label}</h3>
    <div class="fg">${fmls.map((f,i)=>`<div class="fb"><div class="ff" id="fml_${page}_${i}"></div><div class="fd">${f.desc}</div></div>`).join('')}
    </div></div>`;
  // Render KaTeX into each placeholder
  if (typeof katex !== 'undefined') {
    fmls.forEach((f,i) => {
      const el2 = document.getElementById(`fml_${page}_${i}`);
      if (el2) try {
        katex.render(f.f, el2, {displayMode:true, throwOnError:false});
      } catch(e) { el2.textContent = f.f; }
    });
  } else {
    // KaTeX not loaded yet — show plain text and retry
    fmls.forEach((f,i)=>{
      const el2=document.getElementById(`fml_${page}_${i}`);
      if(el2) el2.textContent=f.f;
    });
    setTimeout(()=>renderFormulas(el),500);
  }
}

// FULL EXAM
// ─────────────────────────────────────────────
function renderExam(el) {
  const allQ = Object.values(QB).flat();
  // Start timer if not running
  if (!examTimer) {
    examTimer = setInterval(()=>{
      examSecs--;
      const m = String(Math.floor(examSecs/60)).padStart(2,'0');
      const s = String(examSecs%60).padStart(2,'0');
      const el = document.getElementById('et');
      if (el) { el.textContent=m+':'+s; if(examSecs<=300) el.style.color='var(--red)'; }
      if (examSecs<=0) clearInterval(examTimer);
    },1000);
  }
  const m=String(Math.floor(examSecs/60)).padStart(2,'0'), s=String(examSecs%60).padStart(2,'0');
  const done=allQ.filter(q=>answered[q.id]!==undefined).length;
  const correct=allQ.filter(q=>isCorrect(q)).length;

  let html=`<div class="etimer">
    <span style="font-size:1.3rem">📝</span>
    <div><strong>Full Practice Exam</strong><br>
    <span style="font-size:.78rem;color:var(--text2)">${allQ.length} questions from 2023 & 2024 exams</span></div>
    <span id="et" style="margin-left:auto;font-size:1.3rem;font-weight:800;font-family:monospace;color:var(--cyan)">${m}:${s}</span>
    <button class="btn btn-o" style="margin-left:8px" onclick="resetExam()">↺ Reset</button>
  </div>
  <div class="scorebar" style="margin-bottom:14px">
    <div class="sc"><div class="sv">${correct}/${allQ.length}</div><div class="sl">Correct</div></div>
    <div class="sc"><div class="sv">${done}/${allQ.length}</div><div class="sl">Answered</div></div>
    <div class="sc"><div class="sv" style="color:${allQ.length&&correct/allQ.length>=.7?'var(--green)':'var(--red)'}">${allQ.length?Math.round(100*correct/allQ.length):0}%</div><div class="sl">Score</div></div>
    <div class="sc"><div class="sv" style="color:var(--yellow)">${allQ.length?Math.round(1+correct*9/allQ.length*0.9):1}.0</div><div class="sl">Est. Grade</div></div>
  </div>`;

  // Group by topic
  ['t1','t2','t3','t4','t5','t6','t7'].forEach(tid=>{
    const qs=QB[tid]||[];
    if(!qs.length) return;
    const t=TOPICS.find(x=>x.id===tid);
    html+=`<div style="margin-bottom:6px;padding:8px 12px;background:var(--bg3);border-radius:8px;font-size:.8rem;font-weight:700;color:var(--cyan)">
      ${t.icon} Topic ${t.num}: ${t.label}
    </div>`;
    qs.forEach((q,qi)=>{
      const ua=answered[q.id], isAnswered=ua!==undefined;
      const typeLabel=q.type==='calc'?'<span class="qtype calc">CALC</span>':q.type==='diag'?'<span class="qtype diag">DIAGRAM</span>':q.type==='open'?'<span class="qtype open">OPEN</span>':'';
      html+=`<div class="qbox" id="qb_${q.id}">
        <div class="qhead">
          <span class="qnum">Q${qi+1}</span>
          <span class="qsrc">${q.src}·Q${q.n}</span>${typeLabel}
          <span style="flex:1;margin-left:8px" class="qtxt">${q.text.replace(/\n/g,'<br>')}</span>
        </div>
        <div class="qbody">
          ${q.svg?`<div class="qdiag">${SVG[q.svg]||''}</div>`:''}
          ${q.type==='open'
            ? (isAnswered ? openResultHTML(q) : openInputHTML(q,tid)+hintHTML(q.id))
            : `<div class="opts">${q.opts.map((opt,oi)=>{
                let cls='opt';
                if(isAnswered){ cls+=' dis'; if(oi===q.ans) cls+=' ok'; else if(oi===ua) cls+=' bad'; }
                return `<div class="${cls}" onclick="answer('${q.id}',${oi},${q.ans},'${tid}')">
                  <span class="ol">${String.fromCharCode(65+oi)})</span><span>${opt}</span>
                </div>`;
              }).join('')}</div>
              ${!isAnswered ? hintHTML(q.id) : ''}
              <div class="exp${isAnswered?' show':''}" id="exp_${q.id}">${q.explanation||''}</div>
              ${isAnswered&&q.steps?`<div class="steps">${q.steps.map(s=>`<div class="step"><div class="sn">${s.n}</div><code class="sf">${s.f}</code></div>`).join('')}</div>`:''}`
          }
        </div>
      </div>`;
    });
  });

  el.innerHTML=html;
}

function resetExam() {
  Object.values(QB).flat().forEach(q=>delete answered[q.id]);
  clearInterval(examTimer); examTimer=null; examSecs=90*60;
  updateProgress(); renderContent();
}

// FORMULA PANEL ENGINE
// ─────────────────────────────────────────────
function renderFormulaPanel() {
  const body = document.getElementById('fml-panel-body');
  if (!body) return;
  let html = '';
  FORMULA_SHEET.forEach(sec => {
    html += `<div class="fml-sec">
      <div class="fml-sec-title">${sec.section}</div>
      ${sec.formulas.map(f => `<div class="fml-row" id="fs_${f.id}">
        <div class="fml-katex" id="fsk_${f.id}"></div>
        <div class="fml-lbl">${f.label}</div>
      </div>`).join('')}
    </div>`;
  });
  body.innerHTML = html;
  // Render KaTeX for each formula row
  function renderAll() {
    if (typeof katex === 'undefined') { setTimeout(renderAll, 400); return; }
    FORMULA_SHEET.forEach(sec => sec.formulas.forEach(f => {
      const el = document.getElementById('fsk_'+f.id);
      if (el) try { katex.render(f.latex, el, {displayMode:false, throwOnError:false}); }
              catch(e) { el.textContent = f.latex; }
    }));
  }
  renderAll();
}

function openFormulaPanel(ids) {
  const panel = document.getElementById('fml-panel');
  const fab = document.getElementById('fab-fml');
  panel.classList.add('open');
  if (fab) fab.classList.add('active');
  // Clear old highlights
  document.querySelectorAll('.fml-row.hl').forEach(el => el.classList.remove('hl'));
  if (ids && ids.length) {
    ids.forEach(id => {
      const row = document.getElementById('fs_'+id);
      if (row) row.classList.add('hl');
    });
    // Scroll to first highlighted
    const first = document.getElementById('fs_'+ids[0]);
    if (first) setTimeout(() => first.scrollIntoView({behavior:'smooth', block:'center'}), 150);
  }
}

function closeFormulaPanel() {
  const panel = document.getElementById('fml-panel');
  const fab = document.getElementById('fab-fml');
  panel.classList.remove('open');
  if (fab) fab.classList.remove('active');
}

function toggleFormulaPanel() {
  const panel = document.getElementById('fml-panel');
  if (panel.classList.contains('open')) closeFormulaPanel();
  else openFormulaPanel([]);
}

function showHint(qid) {
  const hint = HINTS[qid];
  if (!hint) return;
  const box = document.getElementById('hint_'+qid);
  if (box) {
    box.classList.toggle('show');
    if (box.classList.contains('show') && hint.ids && hint.ids.length) {
      openFormulaPanel(hint.ids);
    }
  }
}

// Helper: build hint HTML for a question
function hintHTML(qid) {
  const h = HINTS[qid];
  if (!h) return '';
  return `<button class="hint-btn" onclick="showHint('${qid}')">💡 Hint</button>
  <div class="hint-box" id="hint_${qid}">💡 ${h.text}</div>`;
}
